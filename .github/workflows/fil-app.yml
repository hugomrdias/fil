name: fil-app

on:
  push:
    branches: [main]
    paths:
      - apps/fil-app/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/fil-app.yml
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - apps/fil-app/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/fil-app.yml

permissions:
  contents: read

# Cloudflare credentials are set only on the steps that call wrangler, so
# dependency install scripts never see them.
env:
  WRANGLER_SEND_METRICS: 'false'
  PRODUCTION_URL: https://fil-app.hugomrdias.dev

jobs:
  deploy:
    name: Deploy production
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    concurrency:
      group: fil-app-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          require-lockfile: true

      # Reuse the checks CI already cached for this lockfile and turbo config.
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Check and deploy
        run: pnpm turbo run deploy --filter=fil-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe production
        run: |
          for attempt in $(seq 1 12); do
            # The SPA fallback only answers browser navigations.
            if curl --fail --show-error --silent \
              -H 'Sec-Fetch-Mode: navigate' "$PRODUCTION_URL/mainnet/rails" \
              | grep -q '<div id="root">'; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

  preview:
    name: Deploy preview
    # Fork pull requests have no access to secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: fil-app-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          require-lockfile: true

      - name: Build
        run: pnpm turbo run build --filter=fil-app

      - name: Create or update preview
        id: preview
        working-directory: apps/fil-app
        # Previews attach to an existing Worker, which the first production
        # deploy from main creates; until then this step skips with a notice.
        run: |
          errors="$RUNNER_TEMP/wrangler-preview.err"
          status=0
          output="$(pnpm exec wrangler preview \
            --name "pr-$PR_NUMBER" \
            --message "$HEAD_SHA" \
            --json 2> "$errors")" || status=$?
          printf '%s\n' "$output"
          cat "$errors" >&2
          if [ "$status" -ne 0 ]; then
            if grep -q 'code: 10007' "$errors"; then
              echo "::notice::The fil-app Worker does not exist yet. Previews start working after the first production deploy from main."
              exit 0
            fi
            exit "$status"
          fi
          # Asset upload progress precedes the JSON on stdout.
          preview_url="$(printf '%s\n' "$output" | sed -n '/^{/,$p' \
            | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe preview
        if: steps.preview.outputs.preview_url != ''
        # A new Preview URL can return 404 for a few seconds after creation.
        run: |
          for attempt in $(seq 1 12); do
            # The SPA fallback only answers browser navigations.
            if curl --fail --show-error --silent \
              -H 'Sec-Fetch-Mode: navigate' "$PREVIEW_URL/mainnet/rails" \
              | grep -q '<div id="root">'; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s"
            sleep 5
          done
          exit 1
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

      - name: Comment preview URL
        if: steps.preview.outputs.preview_url != ''
        # Update the comment carrying the marker instead of the bot's last
        # comment, so other github-actions comments are never overwritten.
        run: |
          marker='<!-- fil-app-preview -->'
          body="$(cat <<EOF
          $marker
          **fil-app preview** for \`${HEAD_SHA::7}\`

          - Explorer: $PREVIEW_URL/mainnet
          - Calibration: $PREVIEW_URL/calibration
          - Dashboard: $PREVIEW_URL/dashboard
          EOF
          )"
          comment_id="$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" \
            | tail -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

  cleanup:
    name: Delete preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shares the preview group so closing a PR cancels an in-flight preview
    # deploy before deleting it, instead of racing it.
    concurrency:
      group: fil-app-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          require-lockfile: true

      - name: Delete preview
        working-directory: apps/fil-app
        # Nothing to delete when the Worker was never deployed (see preview).
        run: |
          errors="$RUNNER_TEMP/wrangler-preview-delete.err"
          if ! pnpm exec wrangler preview delete --name "pr-$PR_NUMBER" \
            --skip-confirmation 2> "$errors"; then
            cat "$errors" >&2
            if grep -q 'code: 10007' "$errors"; then
              echo "::notice::The fil-app Worker does not exist yet; no preview to delete."
              exit 0
            fi
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
