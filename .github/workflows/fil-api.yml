name: fil-api

on:
  push:
    branches: [main]
    paths:
      - apps/fil-api/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/fil-api.yml
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - apps/fil-api/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/fil-api.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: 'false'
  PRODUCTION_URL: https://fil-api.hugomrdias.dev

jobs:
  deploy:
    name: Deploy production
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    concurrency:
      group: fil-api-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          require-lockfile: true

      - name: Check and deploy
        run: pnpm turbo run deploy --filter=fil-api

      - name: Probe production
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --show-error --silent "$PRODUCTION_URL/health"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

  preview:
    name: Deploy preview
    # Fork pull requests have no access to secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: fil-api-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          require-lockfile: true

      - name: Create or update preview
        id: preview
        working-directory: apps/fil-api
        run: |
          set -o pipefail
          output="$(pnpm exec wrangler preview \
            --name "pr-$PR_NUMBER" \
            --message "$HEAD_SHA" \
            --json)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Probe preview
        run: curl --fail --show-error --silent "$PREVIEW_URL/health"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

      - name: Comment preview URL
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$(cat <<EOF
          **fil-api preview** for \`${HEAD_SHA::7}\`

          - API: $PREVIEW_URL
          - Docs: $PREVIEW_URL/docs
          - Health: $PREVIEW_URL/health
          - MCP: \`$PREVIEW_URL/mcp\`
          EOF
          )"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

  cleanup:
    name: Delete preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          require-lockfile: true

      - name: Delete preview
        working-directory: apps/fil-api
        run: pnpm exec wrangler preview delete --name "pr-$PR_NUMBER" --skip-confirmation
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
