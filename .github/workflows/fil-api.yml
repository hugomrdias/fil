name: fil-api

on:
  push:
    branches: [main]
    paths:
      - apps/fil-api/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/fil-api.yml
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - apps/fil-api/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/fil-api.yml

permissions:
  contents: read

# Cloudflare credentials are set only on the steps that call wrangler, so
# dependency install scripts never see them.
env:
  WRANGLER_SEND_METRICS: 'false'
  PRODUCTION_URL: https://fil-api.hugomrdias.dev

jobs:
  deploy:
    name: Deploy production
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: fil-api-production
      url: ${{ env.PRODUCTION_URL }}
    concurrency:
      group: fil-api-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          require-lockfile: true

      # Reuse the checks CI already cached for this lockfile and turbo config.
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Check and deploy
        run: pnpm turbo run deploy --filter=fil-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe production
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --show-error --silent "$PRODUCTION_URL/health"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

  preview:
    name: Deploy preview
    # Fork pull requests have no access to secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: fil-api-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          require-lockfile: true

      - name: Create or update preview
        id: preview
        working-directory: apps/fil-api
        run: |
          set -o pipefail
          output="$(pnpm exec wrangler preview \
            --name "pr-$PR_NUMBER" \
            --message "$HEAD_SHA" \
            --json)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe preview
        # A new Preview URL can return 404 for a few seconds after creation.
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --show-error --silent "$PREVIEW_URL/health"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s"
            sleep 5
          done
          exit 1
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

      - name: Comment preview URL
        # Update the comment carrying the marker instead of the bot's last
        # comment, so other github-actions comments are never overwritten.
        run: |
          marker='<!-- fil-api-preview -->'
          body="$(cat <<EOF
          $marker
          **fil-api preview** for \`${HEAD_SHA::7}\`

          - API: $PREVIEW_URL
          - Docs: $PREVIEW_URL/docs
          - Health: $PREVIEW_URL/health
          - MCP: \`$PREVIEW_URL/mcp\`
          EOF
          )"
          comment_id="$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" \
            | tail -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

  cleanup:
    name: Delete preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shares the preview group so closing a PR cancels an in-flight preview
    # deploy before deleting it, instead of racing it.
    concurrency:
      group: fil-api-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          require-lockfile: true

      - name: Delete preview
        working-directory: apps/fil-api
        run: pnpm exec wrangler preview delete --name "pr-$PR_NUMBER" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
